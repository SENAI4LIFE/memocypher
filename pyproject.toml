[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "memocypher"
version = "1.0.0"
description = "Authenticated file encryption with a desktop GUI and a CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["encryption", "aes-gcm", "file-encryption", "cryptography", "gui", "cli"]
authors = [{ name = "SENAI4LIFE" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Utilities",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dnd = ["tkinterdnd2>=0.4"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/SENAI4LIFE/memocypher"
Source = "https://github.com/SENAI4LIFE/memocypher"
Issues = "https://github.com/SENAI4LIFE/memocypher/issues"

[project.scripts]
memocypher = "memocypher.cli:main"

[project.gui-scripts]
memocypher-gui = "memocypher.cli:gui_main"

[tool.hatch.build.targets.wheel]
packages = ["memocypher"]

[tool.hatch.build.targets.sdist]
include = ["memocypher", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
